name: Set up Flutter

description: Set up the repository-pinned Flutter SDK and optionally install dependencies from the committed lockfile.

inputs:
  install-dependencies:
    description: Install packages using the committed lockfile.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install Flutter SDK
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version-file: .fvmrc
        channel: stable
        cache: true

    - name: Install locked dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: flutter pub get --enforce-lockfile
