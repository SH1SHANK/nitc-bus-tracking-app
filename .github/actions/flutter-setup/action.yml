name: Set up Flutter

description: Set up the repository-pinned Flutter SDK and optionally install dependencies from the committed lockfile.

inputs:
  install-dependencies:
    description: Install packages using the committed lockfile.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install Flutter SDK
      uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
      with:
        flutter-version-file: .fvmrc
        channel: stable
        cache: true

    - name: Install locked dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: flutter pub get --enforce-lockfile
