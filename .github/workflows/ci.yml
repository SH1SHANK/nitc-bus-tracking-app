name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Dart formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter SDK
        uses: ./.github/actions/flutter-setup
        with:
          install-dependencies: 'false'

      - name: Check formatting without modifying files
        id: format
        run: dart format --output=none --set-exit-if-changed .

      - name: Explain how to fix formatting
        if: failure() && steps.format.outcome == 'failure'
        run: echo "::error title=Formatting check failed::Run 'dart format .' locally and commit the formatted files."

  quality:
    name: Quality and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter and install locked dependencies
        uses: ./.github/actions/flutter-setup

      - name: Scan tracked files for high-confidence secrets
        run: dart run tool/scan_secrets.dart

      - name: Analyze Dart code
        run: flutter analyze

      - name: Verify architecture boundaries
        run: dart run tool/verify_architecture.dart

      - name: Run unit and widget tests
        run: flutter test

  build:
    name: Web and Android debug builds
    needs: [format, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Set up Flutter and install locked dependencies
        uses: ./.github/actions/flutter-setup

      - name: Build Web release
        run: flutter build web --release

      - name: Build Android debug APK
        run: flutter build apk --debug
