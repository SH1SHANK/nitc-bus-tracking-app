name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Dart formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Flutter and install locked dependencies
        uses: ./.github/actions/flutter-setup

      - name: Check formatting without modifying files
        id: format
        run: dart format --output=none --set-exit-if-changed .

      - name: Explain how to fix formatting
        if: failure() && steps.format.outcome == 'failure'
        run: echo "::error title=Formatting check failed::Run 'dart format .' locally and commit the formatted files."

  quality:
    name: Quality and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Flutter and install locked dependencies
        uses: ./.github/actions/flutter-setup

      - name: Scan tracked files for high-confidence secrets
        run: dart run tool/scan_secrets.dart

      - name: Analyze Dart code
        run: flutter analyze

      - name: Verify architecture boundaries
        run: dart run tool/verify_architecture.dart

      - name: Run unit and widget tests
        run: flutter test

  build-web:
    name: Web release build
    needs: [format, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Flutter and install locked dependencies
        uses: ./.github/actions/flutter-setup

      - name: Build Web release
        run: flutter build web --release

  build-android:
    name: Android debug build
    needs: [format, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Free unused runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Set up Java
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Set up Flutter and install locked dependencies
        uses: ./.github/actions/flutter-setup

      - name: Build Android debug APK
        run: flutter build apk --debug
