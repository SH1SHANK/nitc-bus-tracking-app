name: Android release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo 'Missing ANDROID_KEYSTORE_BASE64' >&2; exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo 'Missing ANDROID_KEY_ALIAS' >&2; exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo 'Missing ANDROID_KEY_PASSWORD' >&2; exit 1)
          test -n "$ANDROID_STORE_PASSWORD" || (echo 'Missing ANDROID_STORE_PASSWORD' >&2; exit 1)

      - name: Set up Java
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Set up Flutter and install locked dependencies
        uses: ./.github/actions/flutter-setup

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build production App Bundle
        run: flutter build appbundle --release

      - name: Generate build metadata and sanitize bundle
        run: |
          cat <<EOF > build/app/outputs/bundle/release/BUILD_METADATA.json
          {
            "project": "tracklet",
            "target": "android",
            "version": "0.1.0+1",
            "commit_sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "built_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF
          # Remove signing keys and secrets after build
          rm -f android/app/upload-keystore.jks android/key.properties

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: tracklet-android-aab-${{ github.ref_name }}
          path: build/app/outputs/bundle/release/
          if-no-files-found: error
          retention-days: 14

# Google Play publishing is intentionally not automated until a Play Console
# service account and an explicit release approval process exist.
