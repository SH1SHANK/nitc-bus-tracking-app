name: tracklet
description: "Tracklet - NITC campus bus tracking application built with Flutter for Android and Web."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  supabase_flutter: ^2.18.0
  geolocator: ^14.1.1
  mapbox_maps_flutter: ^3.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  moon_design: ^1.1.0
  shared_preferences: ^2.5.6
  onesignal_flutter: ^5.7.0
  cupertino_icons: ^2.0.0
  flutter_tabler_icons: ^1.43.0
  phosphor_flutter: ^2.1.0
  animated_custom_dropdown: ^4.0.0
  flutter_animate: ^4.5.0
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/Clean_Login_Design_Rectangle_10.png
    - assets/images/Young_Man_Laptop_Clean_Login_Design.png
    - assets/images/Young_Man_with_Laptop.png
    - assets/images/favicon.png
    - assets/images/Abstract_Gradient_Background_4K.jpg
    - assets/images/Research_New_Pin_Crop.gif
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Variable.ttf
