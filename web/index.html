<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tracklet - NITC Campus Bus Tracking Application">

  <!-- Mobile meta tags & icons -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tracklet">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tracklet • NITC Bus Tracking</title>
  <link rel="manifest" href="manifest.json">
  <!-- Cloudflare Turnstile Bot Protection -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <script>
    window.requestTurnstileToken = function(sitekey, action) {
      return new Promise(function(resolve, reject) {
        var attempts = 0;
        function pollTurnstile() {
          if (window.turnstile && typeof window.turnstile.render === 'function') {
            mountWidget();
          } else if (attempts < 50) {
            attempts++;
            setTimeout(pollTurnstile, 100);
          } else {
            reject(new Error('Cloudflare Turnstile script failed to load. Please check your network connection.'));
          }
        }

        function mountWidget() {
          var existing = document.getElementById('turnstile-modal-overlay');
          if (existing && existing.parentNode) {
            existing.parentNode.removeChild(existing);
          }

          var overlay = document.createElement('div');
          overlay.id = 'turnstile-modal-overlay';
          overlay.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(15,23,42,0.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:2147483647;opacity:0;transition:opacity 0.2s ease-in-out;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;';

          var card = document.createElement('div');
          card.style.cssText = 'background:#ffffff;border-radius:18px;padding:24px 28px;box-shadow:0 20px 40px -15px rgba(0,0,0,0.3);display:flex;flex-direction:column;align-items:center;max-width:360px;width:90%;text-align:center;border:1px solid rgba(226,232,240,0.8);';

          var title = document.createElement('h3');
          title.innerText = 'Security Verification';
          title.style.cssText = 'margin:0 0 6px 0;font-size:18px;font-weight:700;color:#0f172a;';

          var subtitle = document.createElement('p');
          subtitle.innerText = 'Please verify that you are human to continue.';
          subtitle.style.cssText = 'margin:0 0 20px 0;font-size:13px;color:#64748b;line-height:1.4;';

          var widgetContainer = document.createElement('div');
          widgetContainer.id = 'turnstile-widget-mount';
          widgetContainer.style.cssText = 'min-height:65px;display:flex;align-items:center;justify-content:center;';

          var cancelBtn = document.createElement('button');
          cancelBtn.type = 'button';
          cancelBtn.innerText = 'Cancel';
          cancelBtn.style.cssText = 'margin-top:18px;background:transparent;border:none;color:#64748b;font-size:14px;font-weight:500;cursor:pointer;padding:6px 14px;border-radius:8px;';
          cancelBtn.onmouseover = function() { cancelBtn.style.color = '#0f172a'; };
          cancelBtn.onmouseout = function() { cancelBtn.style.color = '#64748b'; };

          card.appendChild(title);
          card.appendChild(subtitle);
          card.appendChild(widgetContainer);
          card.appendChild(cancelBtn);
          overlay.appendChild(card);
          document.body.appendChild(overlay);

          requestAnimationFrame(function() {
            overlay.style.opacity = '1';
          });

          var widgetId = null;
          var cleanedUp = false;

          function cleanup() {
            if (cleanedUp) return;
            cleanedUp = true;
            if (overlay && overlay.parentNode) {
              overlay.style.opacity = '0';
              setTimeout(function() {
                if (widgetId !== null && window.turnstile) {
                  try { window.turnstile.remove(widgetId); } catch (_) {}
                }
                if (overlay && overlay.parentNode) {
                  overlay.parentNode.removeChild(overlay);
                }
              }, 200);
            }
          }

          cancelBtn.onclick = function() {
            cleanup();
            reject(new Error('Verification cancelled.'));
          };

          try {
            widgetId = window.turnstile.render('#turnstile-widget-mount', {
              sitekey: sitekey,
              action: action || 'guest_login',
              theme: 'light',
              size: 'normal',
              callback: function(token) {
                cleanup();
                resolve(token);
              },
              'error-callback': function(code) {
                cleanup();
                reject(new Error('Turnstile verification failed (error: ' + code + ')'));
              },
              'expired-callback': function() {
                if (widgetId !== null && window.turnstile) {
                  try { window.turnstile.reset(widgetId); } catch (_) {}
                }
              }
            });
          } catch (err) {
            cleanup();
            reject(err);
          }
        }

        pollTurnstile();
      });
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
