  <script>
    // Flush stale service workers and old cache storage from prior application builds,
    // preserving OneSignalSDKWorker for push notifications
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          var scriptUrl = (registrations[i].active && registrations[i].active.scriptURL) || '';
          if (!scriptUrl.includes('OneSignalSDKWorker')) {
            registrations[i].unregister();
          }
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          if (!names[i].includes('onesignal')) {
            caches.delete(names[i]);
          }
        }
      });
    }
  </script>

  <!-- Cloudflare Turnstile Bot Protection -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async="" defer=""></script>
  <script>
    window.requestTurnstileToken = function(sitekey, action) {
      return new Promise(function(resolve, reject) {
        if (!sitekey || typeof sitekey !== 'string' || sitekey.trim().length === 0) {
          resolve(null);
          return;
        }

        function ensureScriptLoaded() {
          if (window.turnstile && typeof window.turnstile.render === 'function') return;
          var script = document.querySelector('script[src*="challenges.cloudflare.com/turnstile"]');
          if (!script) {
            script = document.createElement('script');
            script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
            script.async = true;
            script.defer = true;
            document.head.appendChild(script);
          }
        }

        var attempts = 0;
        ensureScriptLoaded();

        function pollTurnstile() {
          if (window.turnstile && typeof window.turnstile.render === 'function') {
            mountWidget();
          } else if (attempts < 60) {
            attempts++;
            setTimeout(pollTurnstile, 100);
          } else {
            reject(new Error('Cloudflare Turnstile script failed to load. Please check your network connection.'));
          }
        }

        function mountWidget() {
          var existing = document.getElementById('turnstile-modal-overlay');
          if (existing && existing.parentNode) {
            existing.parentNode.removeChild(existing);
          }

          var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var cardBg = isDark ? '#1e293b' : '#ffffff';
          var cardBorder = isDark ? 'rgba(51,65,85,0.8)' : 'rgba(226,232,240,0.8)';
          var titleColor = isDark ? '#f8fafc' : '#0f172a';
          var subtitleColor = isDark ? '#94a3b8' : '#64748b';
          var btnColor = isDark ? '#94a3b8' : '#64748b';
          var btnHoverColor = isDark ? '#f8fafc' : '#0f172a';

          var overlay = document.createElement('div');
          overlay.id = 'turnstile-modal-overlay';
          overlay.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(15,23,42,0.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:2147483647;opacity:0;transition:opacity 0.2s ease-in-out;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;';

          var card = document.createElement('div');
          card.style.cssText = 'background:' + cardBg + ';border-radius:18px;padding:24px 28px;box-shadow:0 20px 40px -15px rgba(0,0,0,0.3);display:flex;flex-direction:column;align-items:center;max-width:360px;width:90%;text-align:center;border:1px solid ' + cardBorder + ';';

          var title = document.createElement('h3');
          title.innerText = 'Security Verification';
          title.style.cssText = 'margin:0 0 6px 0;font-size:18px;font-weight:700;color:' + titleColor + ';';

          var subtitle = document.createElement('p');
          subtitle.innerText = 'Please complete the verification challenge to continue.';
          subtitle.style.cssText = 'margin:0 0 20px 0;font-size:13px;color:' + subtitleColor + ';line-height:1.4;';

          var widgetContainer = document.createElement('div');
          widgetContainer.id = 'turnstile-widget-mount';
          widgetContainer.style.cssText = 'min-height:65px;display:flex;align-items:center;justify-content:center;';

          var cancelBtn = document.createElement('button');
          cancelBtn.type = 'button';
          cancelBtn.innerText = 'Cancel';
          cancelBtn.style.cssText = 'margin-top:18px;background:transparent;border:none;color:' + btnColor + ';font-size:14px;font-weight:500;cursor:pointer;padding:6px 14px;border-radius:8px;';
          cancelBtn.onmouseover = function() { cancelBtn.style.color = btnHoverColor; };
          cancelBtn.onmouseout = function() { cancelBtn.style.color = btnColor; };

          card.appendChild(title);
          card.appendChild(subtitle);
          card.appendChild(widgetContainer);
          card.appendChild(cancelBtn);
          overlay.appendChild(card);
          document.body.appendChild(overlay);

          requestAnimationFrame(function() {
            overlay.style.opacity = '1';
          });

          var widgetId = null;
          var cleanedUp = false;

          function cleanup() {
            if (cleanedUp) return;
            cleanedUp = true;
            if (overlay && overlay.parentNode) {
              overlay.style.opacity = '0';
              setTimeout(function() {
                if (widgetId !== null && window.turnstile) {
                  try { window.turnstile.remove(widgetId); } catch (_) {}
                }
                if (overlay && overlay.parentNode) {
                  overlay.parentNode.removeChild(overlay);
                }
              }, 200);
            }
          }

          cancelBtn.onclick = function() {
            cleanup();
            reject(new Error('Verification cancelled.'));
          };

          overlay.onclick = function(e) {
            if (e.target === overlay) {
              cleanup();
              reject(new Error('Verification cancelled.'));
            }
          };

          try {
            widgetId = window.turnstile.render(widgetContainer, {
              sitekey: sitekey,
              action: action || 'login',
              theme: isDark ? 'dark' : 'light',
              size: 'normal',
              callback: function(token) {
                cleanup();
                resolve(token);
              },
              'error-callback': function(code) {
                cleanup();
                var msg = 'Turnstile verification failed (error: ' + code + ')';
                var codeStr = String(code);
                if (codeStr.indexOf('110200') !== -1) {
                  msg = 'Turnstile verification failed: domain not allowed (' + window.location.hostname + ' is not registered in widget domain settings).';
                } else if (codeStr.indexOf('110600') !== -1) {
                  msg = 'Turnstile verification failed: invalid sitekey configured.';
                } else if (codeStr.indexOf('300030') !== -1) {
                  msg = 'Turnstile verification challenge timed out. Please try again.';
                }
                reject(new Error(msg));
              },
              'expired-callback': function() {
                if (widgetId !== null && window.turnstile) {
                  try { window.turnstile.reset(widgetId); } catch (_) {}
                }
              }
            });
          } catch (err) {
            cleanup();
            reject(err);
          }
        }

        if (window.turnstile && typeof window.turnstile.render === 'function') {
          mountWidget();
        } else if (window.turnstile && typeof window.turnstile.ready === 'function') {
          window.turnstile.ready(mountWidget);
        } else {
          pollTurnstile();
        }
      });
    };
  </script>
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FAFBFF;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0F1117;
          }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
    window.addEventListener('flutter-first-frame', function() {
      removeSplashFromWeb();
    });
  </script>
